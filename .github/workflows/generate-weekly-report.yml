name: Generate Weekly Report
on:
  workflow_dispatch:
    inputs:
      report_start_date: {description: "보고서 시작일 YYYY-MM-DD", required: false, type: string}
      report_end_date: {description: "보고서 종료일 YYYY-MM-DD", required: false, type: string}
      report_date: {description: "보고일 YYYY-MM-DD", required: false, type: string}
permissions: {contents: write}
concurrency: {group: generate-weekly-report, cancel-in-progress: false}
jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - run: git fetch origin main && git checkout main && git reset --hard origin/main
      - uses: actions/setup-node@v4
        with: {node-version: "24", cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: npm ci && python -m pip install --disable-pip-version-check python-docx==1.2.0
      - name: Validate selected article file
        run: test -s data/selected-news.json || (echo "data/selected-news.json is missing" && exit 1)
      - name: Generate report JSON and inject into Word template
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_FINAL_REPORT_MODEL: ${{ vars.OPENAI_FINAL_REPORT_MODEL || 'gpt-5.4' }}
          OPENAI_FINAL_REPORT_REASONING: ${{ vars.OPENAI_FINAL_REPORT_REASONING || 'high' }}
          FINAL_REPORT_REQUIRED: "true"
          FINAL_REPORT_EVIDENCE_CHARS: "12000"
          REPORT_START_DATE: ${{ inputs.report_start_date }}
          REPORT_END_DATE: ${{ inputs.report_end_date }}
          REPORT_DATE: ${{ inputs.report_date }}
          PYTHON_BIN: python
        run: npm run report
      - run: git config pull.rebase true && git pull --rebase --autostash origin main
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Generate Iraq weekly report from selected articles"
          file_pattern: "reports/** data/selected-news.json"
