name: Collect Iraq Weekly News
on:
  workflow_dispatch:
  schedule:
    - cron: "17 21 * * *"
permissions:
  contents: write
concurrency:
  group: collect-iraq-weekly-news
  cancel-in-progress: false
jobs:
  collect-news:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - run: git fetch origin main && git checkout main && git reset --hard origin/main
      - uses: actions/setup-node@v4
        with: {node-version: "24", cache: npm}
      - run: npm ci && npm run validate
      - name: Collect and hydrate source articles
        env:
          NEWS_LOOKBACK_DAYS: "30"
          MAX_PER_QUERY: "30"
          MAX_TOTAL: "320"
          FETCH_TIMEOUT_MS: "12000"
          ARTICLE_FETCH_CONCURRENCY: "4"
        run: npm run collect
      - name: Filter regional news
        run: node scripts/filter-regional-iraq-exposure.mjs
      - name: Prepare Korean domestic media
        run: node scripts/prepare-domestic-media.mjs
      - name: Score, translate and extract facts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_FACT_MODEL: "gpt-5.4"
          OPENAI_FACT_FALLBACK_MODEL: "gpt-5.4-mini"
          FACT_EXTRACTION_MAX_ITEMS: "180"
          FACT_AI_CONCURRENCY: "4"
          FACT_MAX_EVIDENCE_CHARS: "12000"
          FULL_TRANSLATION_MIN_SCORE: "60"
          SCORING_POLICY_FILE: "data/news-scoring-policy.json"
        run: node scripts/extract-article-facts.mjs
      - name: Refine high-value report writing
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_REPORT_MODEL: "gpt-5.4-mini"
          OPENAI_REPORT_REASONING: "medium"
          REPORT_REFINEMENT_MIN_SCORE: "70"
          MAX_REPORT_REFINEMENT_ITEMS: "20"
          REPORT_REFINEMENT_CONCURRENCY: "2"
        run: node scripts/refine-report-writing.mjs
      - name: Normalize entities and post-process
        run: node scripts/normalize-extracted-entities.mjs && npm run postprocess
      - run: git config pull.rebase true && git pull --rebase --autostash origin main
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update scored and translated Iraq news"
          file_pattern: "data/*.json"
